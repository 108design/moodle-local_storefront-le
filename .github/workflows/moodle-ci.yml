name: Moodle Plugin CI

on:
  push:
    branches: [main]
    paths-ignore: [README.md, 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: [README.md, 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -e -o pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Moodle ${{ matrix.lane.moodle }} / PHP ${{ matrix.lane.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane:
          - {moodle: '5.2', branch: MOODLE_502_STABLE, php: '8.3'}
        database: [mariadb]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB: ${{ matrix.database }}
      MOODLE_BRANCH: ${{ matrix.lane.branch }}
      NVM_DIR: /home/runner/.nvm
    steps:
      - name: Check out plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: ${{ matrix.lane.php }}
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, pdo_mysql, pdo_pgsql, pgsql, soap, sodium, xml, xmlreader, xmlwriter, zip
          ini-values: max_input_vars=5000, memory_limit=768M
          coverage: none
          tools: composer
      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci 4.5.11
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Add plugin dependencies
        run: |
          moodle-plugin-ci add-plugin --branch v1.1.0 108design/moodle-enrol_storefront

      - name: Install fresh Moodle and plugin
        id: install
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1 2>&1 | tee install.log
      - name: PHP syntax
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phplint
      - name: Plugin structure and database prefixes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci validate
      - name: Upgrade savepoints
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci savepoints
      - name: PHPUnit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: moodle-plugin-ci phpunit --testdox --fail-on-warning --fail-on-skipped 2>&1 | tee phpunit.log
      - name: Save diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: diagnostics-${{ matrix.lane.branch }}-${{ matrix.database }}
          path: |
            install.log
            phpunit.log
          retention-days: 7
          if-no-files-found: ignore
